
services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
  db:
    image: mysql:8.0        # debugroom/viewComments_v2.php がウィンドウ関数を使うため 8.0 系を指定
    container_name: survey_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass       # 開発用の仮パスワード。必要に応じて変更してください
      MYSQL_DATABASE: survey_app          # このDBは初回起動時に自動作成される
      MYSQL_USER: survey_user             # アプリ用ユーザーも自動作成される（root直使いを避ける）
      MYSQL_PASSWORD: survey_pass
    ports:
      - "3306:3306"                       # ホスト側から 127.0.0.1:3306 で接続できるようにする
    volumes:
      - db_data:/var/lib/mysql            # ★ここがデータの実体。コンテナを消してもこのボリュームは残る
      - ./sql/init:/docker-entrypoint-initdb.d:ro   # 初回起動時にここの.sqlが自動実行される
 
volumes:
  db_data:    # 名前付きボリューム。`docker compose down -v` しない限り消えない
 